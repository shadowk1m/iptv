# Serve the playlists on your LAN Docker host.
#
#   docker compose up -d --build
#
# Then point your player at short URLs, e.g.:
#   http://<host-ip>:8080/iptv.txt
#   http://<host-ip>:8080/catchup.m3u
#
# Builds the iptv image (Dockerfile bakes the playlists in). The ./ bind
# mount below is OPTIONAL — comment it out to use the baked-in copies, or
# keep it to serve regenerated playlists without rebuilding the image.

services:
  iptv:
    build: .
    image: iptv:latest
    container_name: iptv
    ports:
      - "8080:80"
    volumes:
      - ./:/srv/iptv:ro
    restart: unless-stopped

# Short-URL aliases for easy typing on TV remotes & player settings.
# Keeps MIME types correct and blocks access to scripts/raw files.

server {
    listen 80;
    root /srv/iptv;
    charset utf-8;

    # --- Short CDN Aliases ---
    # Flat DIYP/百川 TXT (153 channels)
    location = /iptv.txt {
        alias /srv/iptv/shaanxi-mobile-cdn-diyp.txt;
        default_type text/plain;
    }
    # Grouped DIYP/百川 TXT (153 channels)
    location = /iptv2.txt {
        alias /srv/iptv/shaanxi-mobile-cdn-diyp-grouped.txt;
        default_type text/plain;
    }
    # Master M3U (153 channels, no catchup)
    location = /iptv.m3u {
        alias /srv/iptv/shaanxi-mobile-cdn.m3u;
        default_type application/vnd.apple.mpegurl;
    }
    # Catch-up M3U (TiviMate/DIYP/APTV tokens)
    location = /catchup.m3u {
        alias /srv/iptv/shaanxi-mobile-cdn-catchup.m3u;
        default_type application/vnd.apple.mpegurl;
    }
    # Catch-up M3U (Kodi tokens)
    location = /kodi.m3u {
        alias /srv/iptv/shaanxi-mobile-cdn-catchup-kodi.m3u;
        default_type application/vnd.apple.mpegurl;
    }

    # --- Short GITV Aliases ---
    # Flat GITV TXT (160 channels)
    location = /gitv.txt {
        alias /srv/iptv/shaanxi-mobile-xian-gitv-diyp.txt;
        default_type text/plain;
    }
    # Grouped GITV TXT (160 channels)
    location = /gitv2.txt {
        alias /srv/iptv/shaanxi-mobile-xian-gitv-diyp-grouped.txt;
        default_type text/plain;
    }
    # GITV M3U (160 channels)
    location = /gitv.m3u {
        alias /srv/iptv/shaanxi-mobile-xian-gitv.m3u;
        default_type application/vnd.apple.mpegurl;
    }

    # --- Permissions ---
    # Only allow serving .txt and .m3u files directly
    location ~ \.(txt|m3u)$ {
        default_type text/plain;
    }
    # Block access to python scripts, git internals, and raw data
    location / {
        return 404;
    }
}

# Build and publish the iptv image to GHCR on every playlist change.
#
# After this runs once, your LAN host needs no repo and no build:
#
#   docker pull ghcr.io/shadowk1m/iptv:latest
#   docker run -d -p 8080:80 --name iptv ghcr.io/shadowk1m/iptv:latest

name: Build image

on:
  push:
    branches: [main]
    paths:
      - 'shaanxi-mobile-*'
      - 'Dockerfile'
      - 'nginx.conf'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shadowk1m/iptv:latest
            ghcr.io/shadowk1m/iptv:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
